<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Minecraft - Gaming Hub</title>
    <!-- Collegamento allo stile comune dell'hub -->
    <link rel="stylesheet" href="style.css">
    <style>
        .quiz-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 240, 255, 0.2);
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            text-align: left;
        }
        .question-text {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 15px;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option-btn {
            background: #2a2a40;
            border: 1px solid rgba(0, 240, 255, 0.3);
            color: #fff;
            padding: 12px 15px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
        }
        /* Classi dinamiche per il feedback delle risposte */
        .option-btn.correct {
            background: #2b8a3e !important;
            border-color: #40c057 !important;
            box-shadow: 0 0 12px #2b8a3e;
        }
        .option-btn.wrong {
            background: #c92a2a !important;
            border-color: #fa5252 !important;
            box-shadow: 0 0 12px #c92a2a;
        }
        .option-btn:hover:not(:disabled) {
            background: rgba(0, 240, 255, 0.1);
            border-color: #00f0ff;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }
        .option-btn:disabled {
            cursor: not-allowed;
        }
        .result-box {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #b3b3b3;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.3s;
        }
        .back-link:hover { color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🟩 Quiz Minecraft Master 🟩</h2>
        <p id="quiz-progress">Domanda 1 di 15</p>

        <!-- Contenitore Domande attive -->
        <div class="quiz-box" id="quiz-screen">
            <div class="question-text" id="question">Caricamento domanda...</div>
            <div class="options-list" id="options"></div>
        </div>

        <!-- Schermata di Fine Quiz -->
        <div class="result-box" id="result-screen">
            <h3 id="result-title" style="color: #ffaa00; font-size: 1.8rem; margin-bottom: 10px;">Quiz Terminato!</h3>
            <p id="result-score" style="font-size: 1.2rem; color: #fff;"></p>
            <p id="result-reward" style="color: #00f0ff; font-weight: bold; margin-top: 10px;"></p>
            <button class="btn-card game-btn" onclick="location.reload()" style="width: 100%; margin-top: 20px; justify-content: center;">🔄 Riprova il Quiz</button>
        </div>

        <a href="index.html" class="back-link">⬅ Torna al Menu Principale</a>
    </div>

    <script>
        // Lista di 15 domande specifiche su Minecraft
        const domande = [
            { q: "Quale minerale serve per attivare e alimentare un faro (Beacon) oltre ai lingotti e smeraldi?", o: ["Carbone", "Lapislazzuli", "Diamante", "Quarzo del Nether"], a: 2 },
            { q: "Quale mostro ha paura dei gatti e scappa quando ne vede uno vicino?", o: ["Creeper", "Zombie", "Scheletro", "Enderman"], a: 0 },
            { q: "Quanti blocchi di ossidiana servono come minimo per costruire la struttura di un portale del Nether?", o: ["8", "10", "12", "14"], a: 1 },
            { q: "Quale cibo calma e permette di addomesticare un lupo?", o: ["Pesce crudo", "Mela d'oro", "Osso", "Carota"], a: 2 },
            { q: "In quale dimensione si trova la fortezza presidiata dai Blaze?", o: ["Overworld", "Nether", "End", "Aether"], a: 1 },
            { q: "Quale materiale si ottiene fondendo la sabbia in una fornace?", o: ["Vetro", "Mattone", "Argilla", "Terracotta"], a: 0 },
            { q: "Cosa succede se un Enderman tocca l'acqua?", o: ["Diventa più forte", "Subisce danni e si teletrasporta", "Si trasforma", "Muore all'istante"], a: 1 },
            { q: "Di quale materiale deve essere fatto un piccone per poter estrarre i blocchi d'oro?", o: ["Legno", "Pietra", "Ferro", "Oro stesso"], a: 2 },
            { q: "Quale boss evochi posizionando 4 blocchi di Sabbia delle Anime e 3 teschi di scheletro Wither?", o: ["Ender Dragon", "Wither", "Warden", "Evocatore"], a: 1 },
            { q: "Quale strumento serve per tosare le pecore senza ucciderle?", o: ["Cesoie", "Spada", "Ascia", "Accendino"], a: 0 },
            { q: "Di che colore sono gli occhi di un Enderman quando è calmo?", o: ["Rossi", "Verdi", "Viola", "Blu"], a: 2 },
            { q: "Quale di questi blocchi NON è influenzato dalla gravità e non cade?", o: ["Sabbia", "Gravel", "Fango", "Pietra"], a: 3 },
            { q: "Quale creatura rilascia le preziose 'Elitre' (Elytra)?", o: ["Nessuna, si trovano nei vascelli dell'End", "Ender Dragon", "Shulker", "Phantom"], a: 0 },
            { q: "Cosa serve per creare un letto in Minecraft?", o: ["3 assi di legno e 3 blocchi di lana", "4 assi di legno e 2 di lana", "6 blocchi di ferro", "3 blocchi di pietra e 3 di lana"], a: 0 },
            { q: "In quale aggiornamento storico è stato introdotto il temibile Warden?", o: ["1.16 - Nether Update", "1.17 - Caves & Cliffs Parte 1", "1.19 - The Wild Update", "1.20 - Trails & Tales"], a: 2 }
        ];

        let indexDomanda = 0;
        let risposteCorrette = 0;

        function mostraDomanda() {
            if (indexDomanda < domande.length) {
                document.getElementById('quiz-progress').innerText = `Domanda ${indexDomanda + 1} di ${domande.length}`;
                document.getElementById('question').innerText = domande[indexDomanda].q;
                
                const containerOpzioni = document.getElementById('options');
                containerOpzioni.innerHTML = '';

                domande[indexDomanda].o.forEach((opzione, i) => {
                    const bottone = document.createElement('button');
                    bottone.className = 'option-btn';
                    bottone.innerText = opzione;
                    bottone.onclick = () => controllaRisposta(i, bottone);
                    containerOpzioni.appendChild(bottone);
                });
            } else {
                mostraRisultatoFinale();
            }
        }

        function controllaRisposta(indiceScelto, bottoneCliccato) {
            const indiceCorretto = domande[indexDomanda].a;
            const tuttiIBottoni = document.querySelectorAll('.option-btn');

            tuttiIBottoni.forEach(btn => btn.disabled = true);

            if (indiceScelto === indiceCorretto) {
                bottoneCliccato.classList.add('correct');
                risposteCorrette++;
            } else {
                bottoneCliccato.classList.add('wrong');
                tuttiIBottoni[indiceCorretto].classList.add('correct');
            }

            setTimeout(() => {
                indexDomanda++;
                mostraDomanda();
            }, 1200);
        }

        function mostraRisultatoFinale() {
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('quiz-progress').style.display = 'none';
            
            const resultScreen = document.getElementById('result-screen');
            const scoreText = document.getElementById('result-score');
            const rewardText = document.getElementById('result-reward');
            
            resultScreen.style.display = 'block';
            scoreText.innerText = `Hai totalizzato ${risposteCorrette} su ${domande.length} risposte esatte!`;

            // OBIETTIVO SBLOCCO: Almeno 11 risposte corrette su 15
            if (risposteCorrette >= 11) {
                if (localStorage.getItem('obj_minecraft_done') !== 'true') {
                    let totalHubXP = parseInt(localStorage.getItem('hub_total_xp') || '0');
                    localStorage.setItem('hub_total_xp', (totalHubXP + 40).toString());
                    localStorage.setItem('obj_minecraft_done', 'true');
                }
                rewardText.innerText = "🏆 OBIETTIVO RAGGIUNTO! Hai fatto almeno 11 punti: guadagni +40 XP e sblocchi il Medaglione 'Crafter Supremo'!";
                rewardText.style.color = "#00f0ff";
            } else {
                rewardText.innerText = `Ti mancano ${11 - risposteCorrette} risposte corrette per raggiungere l'obiettivo (minimo 11/15) e sbloccare il Medaglione!`;
                rewardText.style.color = "#aaa";
            }
        }

        mostraDomanda();
    </script>
</body>
</html>
