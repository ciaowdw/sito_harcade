<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Random Soccer Mobile</title><style>body{margin:0;background:#111;display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;font-family:sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}#g-cont{display:flex;flex-direction:column;align-items:center;width:100%;max-width:950px}canvas{background:#2c3e50;width:100%;max-height:70vh;object-fit:contain;box-sizing:border-box}#ctrls{display:none;width:100%;justify-content:space-between;padding:10px 20px;box-sizing:border-box}#ctrls.active{display:flex}.c-grp{display:flex;gap:10px}.b-t{width:65px;height:65px;background:rgba(255,255,255,0.15);border:none;border-radius:12px;color:#fff;font-size:28px;font-weight:bold;display:flex;align-items:center;justify-content:center;touch-action:manipulation}.b-t:active{background:rgba(255,255,255,0.35)}</style></head><body><div id="g-cont"><canvas id="g" width="950" height="600"></canvas><div id="ctrls"><div class="c-grp"><button class="b-t" id="p1_l">←</button><button class="b-t" id="p1_r">→</button><button class="b-t" id="p1_u">↑</button></div><div class="c-grp" id="p2_g"><button class="b-t" id="p2_u">↑</button><button class="b-t" id="p2_l">←</button><button class="b-t" id="p2_r">→</button></div></div></div><script>const c=document.getElementById("g"),ctx=c.getContext("2d"),ctrlsDiv=document.getElementById("ctrls"),p2Grp=document.getElementById("p2_g");let grav=0.45,bnce=0.72,gY=530,ball={x:475,y:150,vx:2,vy:0,r:15},sB=0,sR=0,gH=210,gW=70,lGL=70,rGL=880,cbY=gY-gH,mode=0,menuStep=0,mx=0,my=0,cd=3,cdT=0;const btns={p1_l:!1,p1_r:!1,p1_u:!1,p2_l:!1,p2_r:!1,p2_u:!1};function initBtn(id){const b=document.getElementById(id);if(b){b.addEventListener("touchstart",e=>{e.preventDefault();btns[id]=!0});b.addEventListener("touchend",e=>{e.preventDefault();btns[id]=!1})}}["p1_l","p1_r","p1_u","p2_l","p2_r","p2_u"].forEach(initBtn);const teams=[{n:"MILAN",c:"#e3242b",s:"#000000",t:1},{n:"AZZURRO",c:"#3498db",s:"",t:0},{n:"GIALLO",c:"#f1c40f",s:"",t:0},{n:"VERDE",c:"#2ecc71",s:"",t:0},{n:"VIOLA",c:"#9b59b6",s:"",t:0},{n:"ARANCIO",c:"#e67e22",s:"",t:0},{n:"TURCHESE",c:"#1abc9c",s:"",t:0},{n:"ROSA",c:"#e84393",s:"",t:0},{n:"GRIGIO",c:"#7f8c8d",s:"",t:0},{n:"BLU SCURO",c:"#2980b9",s:"",t:0},{n:"ROSSO",c:"#c0392b",s:"",t:0},{n:"NERO",c:"#2d3436",s:"",t:0}];class P{constructor(x,tm,s){this.sX=x;this.x=x;this.y=gY-50;this.vy=0;this.vx=0;this.ang=0;this.av=0;this.tm=tm;this.s=s}res(){this.x=this.sX;this.y=gY-50;this.vy=0;this.vx=0;this.ang=0;this.av=0}up(){this.vy+=grav;this.y+=this.vy;this.x+=this.vx;if(this.y>gY-50){this.y=gY-50;this.vy=0}if(this.x<lGL+15)this.x=lGL+15;if(this.x>rGL-15)this.x=rGL-15;this.ang+=this.av;this.av*=0.88;this.ang*=0.92}drw(ox=0,oy=0){ctx.save();ctx.translate(ox||this.x,oy||this.y);ctx.rotate(this.ang);ctx.fillStyle="#ffdbac";ctx.beginPath();ctx.arc(0,-55,18,0,Math.PI*2);ctx.fill();ctx.fillStyle="#000";ctx.beginPath();ctx.arc(10*this.s,-58,2.5,0,Math.PI*2);ctx.fill();ctx.fillStyle="#111";ctx.beginPath();ctx.arc(0,-62,18,Math.PI,0);ctx.fill();ctx.save();ctx.beginPath();ctx.roundRect(-16,-38,32,48,8);ctx.clip();ctx.fillStyle=this.tm.c;ctx.fillRect(-16,-38,32,48);if(this.tm.t===1){ctx.fillStyle=this.tm.s;ctx.fillRect(-16,-38,6,48);ctx.fillRect(-4,-38,6,48);ctx.fillRect(8,-38,6,48)}ctx.restore();ctx.fillStyle="#fff";ctx.font="bold 13px sans-serif";ctx.textAlign="center";ctx.fillText("10",-2*this.s,-10);ctx.fillStyle="#f1c40f";ctx.fillRect(-6,10,12,25);ctx.fillStyle="#111";ctx.beginPath();ctx.roundRect(-6+(2*this.s),30,18*this.s,10,4);ctx.fill();ctx.restore()}}let p1=new P(280,teams[0],1),p2=new P(670,teams[1],-1);function rst(){ball.x=475;ball.y=150;ball.vx=Math.random()>0.5?2:-2;ball.vy=0;p1.res();p2.res();cd=0}window.addEventListener("touchstart",e=>{const rect=c.getBoundingClientRect();let t=e.changedTouches[0];mx=((t.clientX-rect.left)/rect.width)*c.width;my=((t.clientY-rect.top)/rect.height)*c.height;if(menuStep===0){if(mx>275&&mx<425&&my>260&&my<320){mode=1;menuStep=1;drawColorMenu()}if(mx>525&&mx<675&&my>260&&my<320){mode=2;menuStep=1;drawColorMenu()}}else if(menuStep===1||menuStep===2){for(let i=0;i<12;i++){let r=Math.floor(i/3),co=i%3,bx=300+co*160,by=210+r*65;if(mx>bx&&mx<bx+140&&my>by&&my<by+45){if(menuStep===1){p1.tm=teams[i];menuStep=2;drawColorMenu()}else{p2.tm=teams[i];menuStep=3;cd=3;cdT=Date.now();ctrlsDiv.classList.add("active");p2Grp.style.display=mode===2?"flex":"none";loop()}break}}}});function bOff(px,py){let dx=ball.x-px,dy=ball.y-py,d=Math.sqrt(dx*dx+dy*dy);if(d<ball.r+4){let a=Math.atan2(dy,dx),s=Math.sqrt(ball.vx*ball.vx+ball.vy*ball.vy)*bnce;if(s<2)s=3;ball.vx=Math.cos(a)*s;ball.vy=Math.sin(a)*s;ball.x=px+Math.cos(a)*(ball.r+5);ball.y=py+Math.sin(a)*(ball.r+5)}}function rct(p){if(Math.sqrt((ball.x-p.x)**2+(ball.y-p.y)**2)<80){ball.vy=-8-Math.random()*3;ball.vx=(8+Math.random()*4)*p.s}}function drawMenu(){ctx.fillStyle="#2c3e50";ctx.fillRect(0,0,950,600);ctx.fillStyle="#fff";ctx.font="bold 42px sans-serif";ctx.textAlign="center";ctx.fillText("RANDOM SOCCER",475,150);ctx.font="20px sans-serif";ctx.fillText("Scegli la modalità di gioco:",475,210);ctx.fillStyle="#3498db";ctx.beginPath();ctx.roundRect(275,260,150,60,10);ctx.fill();ctx.fillStyle="#e74c3c";ctx.beginPath();ctx.roundRect(525,260,150,60,10);ctx.fill();ctx.fillStyle="#fff";ctx.font="bold 18px sans-serif";ctx.fillText("1 GIOCATORE",350,295);ctx.fillText("2 GIOCATORI",600,295);ctx.font="14px sans-serif";ctx.fillText("Usa i pulsanti esterni sotto lo schermo per giocare",475,450)}function drawColorMenu(){ctx.fillStyle="#2c3e50";ctx.fillRect(0,0,950,600);ctx.fillStyle="#fff";ctx.font="bold 34px sans-serif";ctx.textAlign="center";ctx.fillText(menuStep===1?"GIOCATORE 1: Scegli l'aspetto":"GIOCATORE 2: Scegli l'aspetto",475,130);let activeP=menuStep===1?p1:p2;for(let i=0;i<12;i++){let r=Math.floor(i/3),co=i%3,bx=300+co*160,by=210+r*65;ctx.fillStyle=teams[i].t===1?"#e3242b":teams[i].c;ctx.beginPath();ctx.roundRect(bx,by,140,45,6);ctx.fill();ctx.fillStyle=teams[i].t===1||teams[i].n==="NERO"||teams[i].n==="ROSSO"?"#fff":"#111";ctx.font="bold 14px sans-serif";ctx.fillText(teams[i].n,bx+70,by+27);if(activeP.tm===teams[i]){ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.stroke()}}ctx.fillStyle="rgba(255,255,255,0.1)";ctx.beginPath();ctx.roundRect(60,180,180,280,15);ctx.fill();activeP.drw(150,390);ctx.fillStyle="#fff";ctx.font="bold 18px sans-serif";ctx.fillText(activeP.tm.n,150,440)}function loop(){if(menuStep<3)return;requestAnimationFrame(loop);if(cd>0){let elapsed=Math.floor((Date.now()-cdT)/1000);cd=3-elapsed}p1.vx=0;if(cd<=0){if(btns.p1_l)p1.vx=-3.8;if(btns.p1_r)p1.vx=3.8;if(btns.p1_u&&p1.y>=gY-50){p1.vy=-10;p1.av=0.65;rct(p1)}}p2.vx=0;if(cd<=0){if(mode===2){if(btns.p2_l)p2.vx=-3.8;if(btns.p2_r)p2.vx=3.8;if(btns.p2_u&&p2.y>=gY-50){p2.vy=-10;p2.av=-0.65;rct(p2)}}else{if(ball.x>450){if(p2.x<ball.x-20)p2.vx=3.3;if(p2.x>ball.x+20)p2.vx=-3.3;if(ball.y<gY-100&&Math.sqrt((ball.x-p2.x)**2)<100&&p2.y>=gY-50&&Math.random()<0.07){p2.vy=-10;p2.av=-0.65;rct(p2)}}else{if(p2.x<670)p2.vx=2;if(p2.x>670)p2.vx=-2}}}p1.up();p2.up();if(cd<=0){ball.vy+=grav;ball.x+=ball.vx;ball.y+=ball.vy}if(ball.y>gY-ball.r){ball.y=gY-ball.r;ball.vy=-ball.vy*bnce;ball.vx*=0.98}if(ball.x<ball.r){ball.x=ball.r;ball.vx=-ball.vx*bnce}if(ball.x>950-ball.r){ball.x=950-ball.r;ball.vx=-ball.vx*bnce}bOff(lGL,cbY);bOff(rGL,cbY);if(ball.y>cbY&&ball.y<gY){if(Math.abs(ball.x-lGL)<ball.r&&ball.vx>0&&ball.x<lGL){ball.vx=-ball.vx*bnce;ball.x=lGL-ball.r}if(Math.abs(ball.x-rGL)<ball.r&&ball.vx<0&&ball.x>rGL){ball.vx=-ball.vx*bnce;ball.x=rGL+ball.r}if(ball.y+ball.r>cbY&&ball.y-ball.r<cbY-8&&(ball.x<lGL||ball.x>rGL)){ball.y=cbY-ball.r-2;ball.vy=-ball.vy*bnce}}if(Math.sqrt((ball.x-p1.x)**2+(ball.y-(p1.y-15))**2)<48){ball.vy=-6-Math.random()*4;ball.vx=6+Math.random()*5;p1.av=-0.4}if(Math.sqrt((ball.x-p2.x)**2+(ball.y-(p2.y-15))**2)<48){ball.vy=-6-Math.random()*4;ball.vx=-6-Math.random()*5;p2.av=0.4}if(ball.y>cbY&&ball.y<gY){if(ball.x+ball.r<lGL){sR++;rst()}if(ball.x-ball.r>rGL){sB++;rst()}}ctx.fillStyle="#2c3e50";ctx.fillRect(0,0,950,600);ctx.fillStyle="#27ae60";ctx.fillRect(0,gY,950,600-gY);ctx.fillStyle="rgba(255,255,255,0.1)";ctx.fillRect(472,0,6,gY);ctx.beginPath();ctx.arc(475,gY,90,Math.PI,0);ctx.lineWidth=5;ctx.strokeStyle="rgba(255,255,255,0.1)";ctx.stroke();ctx.fillStyle="#fff";ctx.font="bold 45px sans-serif";ctx.textAlign="right";ctx.fillText(sB,430,70);ctx.textAlign="left";ctx.fillText(sR,520,70);ctx.fillStyle="rgba(255,255,255,0.2)";ctx.fillRect(lGL,cbY,5,gH);ctx.fillRect(rGL-5,cbY,5,gH);ctx.fillRect(0,cbY,lGL,10);ctx.fillRect(rGL,cbY,950-rGL,10);p1.drw();p2.drw();ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.lineWidth=2;ctx.strokeStyle="#111";ctx.stroke();if(cd>0){ctx.fillStyle="rgba(0,0,0,0.4)";ctx.fillRect(0,0,950,600);ctx.fillStyle="#fff";ctx.font="bold 70px sans-serif";ctx.textAlign="center";ctx.fillText(cd,475,300)}}drawMenu()</script></body></html>
