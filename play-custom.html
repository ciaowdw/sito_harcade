<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gioca Quiz Personalizzato</title><link rel="stylesheet" href="style.css"><style>body{font-family:sans-serif;background:#0f0f1a;color:#fff;text-align:center}.container{max-width:600px;margin:50px auto;padding:20px;background:#1a1a2e;border-radius:12px;box-shadow:0 0 15px rgba(0,240,255,.2)}h1{color:#00f0ff}#options{display:flex;flex-direction:column;gap:10px;margin-top:20px}.btn-opt{padding:12px;background:#222;border:1px solid #333;color:#fff;border-radius:8px;cursor:pointer;font-weight:700;transition:all .2s ease}.btn-opt:hover{background:#ff007f;border-color:#fff}.btn-correct{background:#00ff66!important;color:#000!important;box-shadow:0 0 15px #00ff66;border-color:#fff!important}.btn-wrong{background:#ff0033!important;color:#fff!important;box-shadow:0 0 15px #ff0033;border-color:#fff!important}.back-link{display:inline-block;margin-bottom:15px;color:#00f0ff;text-decoration:none}</style></head><body><div class="container"><a href="index.html" class="back-link">⬅️ Torna all'Hub</a><h1 id="quiz-title">Caricamento...</h1><div id="quiz-game"><h3 id="question-text"></h3><div id="options"></div><p id="progress" style="color:#aaa;margin-top:15px"></p></div><div id="quiz-result" style="display:none"><h2>🎉 Quiz Completato!</h2><p id="score-text"></p><a href="index.html" class="btn-opt" style="display:inline-block;text-decoration:none;margin-top:15px">Torna all'Hub</a></div></div><script>const urlParams=new URLSearchParams(window.location.search);const quizId=parseInt(urlParams.get("id"));const quizzes=JSON.parse(localStorage.getItem("customQuizzes")||"[]");const quiz=quizzes.find(q=>q.id===quizId);if(!quiz){alert("Quiz non trovato!");window.location.href="index.html"}else{document.getElementById("quiz-title").innerText=`${quiz.icon||'📝'} ${quiz.title}`;let currentIdx=0,score=0,isAnswering=!1;function showQuestion(){if(currentIdx>=quiz.questions.length){endQuiz();return}isAnswering=!1;const q=quiz.questions[currentIdx];document.getElementById("question-text").innerText=q.text;const optsDiv=document.getElementById("options");optsDiv.innerHTML="";document.getElementById("progress").innerText=`Domanda ${currentIdx+1} di ${quiz.questions.length}`;const labels=["A","B","C","D"];q.options.forEach((opt,idx)=>{if(!opt)return;const btn=document.createElement("button");btn.className="btn-opt";btn.innerText=`${labels[idx]}: ${opt}`;btn.onclick=()=>checkAnswer(labels[idx],btn);optsDiv.appendChild(btn)})}function checkAnswer(ans,clickedBtn){if(isAnswering)return;isAnswering=!0;const q=quiz.questions[currentIdx];const isCorrect=ans===q.correct;if(isCorrect){score++;clickedBtn.classList.add("btn-correct")}else{clickedBtn.classList.add("btn-wrong");const buttons=document.querySelectorAll(".btn-opt");buttons.forEach(btn=>{if(btn.innerText.startsWith(q.correct+":"))btn.classList.add("btn-correct")})}setTimeout(()=>{currentIdx++;showQuestion()},1e3)}function endQuiz(){document.getElementById("quiz-game").style.display="none";document.getElementById("quiz-result").style.display="block";document.getElementById("score-text").innerText=`Hai risposto correttamente a ${score} su ${quiz.questions.length} domande!`;if(score===quiz.questions.length){let xp=parseInt(localStorage.getItem("globalXP")||"0");xp+=50;localStorage.setItem("globalXP",xp);alert("🏆 Perfetto! Hai guadagnato +50 XP!")}}showQuestion()}</script></body></html>
