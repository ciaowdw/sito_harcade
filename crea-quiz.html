<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crea o Modifica il tuo Quiz</title><link rel="stylesheet" href="style.css"><style>body{font-family:sans-serif;background:#0f0f1a;color:#fff}.container{max-width:600px;margin:30px auto;padding:20px;background:#1a1a2e;border-radius:12px;box-shadow:0 0 15px rgba(0,240,255,.2)}h1,h2{color:#00f0ff;text-align:center}input,select{width:100%;padding:10px;margin:8px 0;background:#111;border:1px solid #333;color:#fff;border-radius:6px;box-sizing:border-box}.btn{display:block;width:100%;padding:12px;background:linear-gradient(45deg,#ff007f,#7928ca);color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer;margin-top:15px;text-align:center;text-decoration:none}.btn-add{background:#00f0ff;color:#000;margin-top:10px;margin-bottom:15px}.form-group{position:relative;margin-bottom:20px;padding:15px;background:#222;border-radius:8px;border-left:4px solid #ff007f}.btn-del-q{position:absolute;top:10px;right:10px;background:none;border:none;color:#ff0033;cursor:pointer;font-size:1.2rem}.back-link{display:inline-block;margin-bottom:15px;color:#00f0ff;text-decoration:none}</style></head><body><div class="container"><a href="index.html" class="back-link">⬅️ Torna all'Hub</a><h1 id="page-title">🛠️ Creatore di Quiz</h1><form id="quiz-form"><div class="form-group"><label><b>Titolo del tuo Quiz:</b></label><input type="text" id="quiz-title" placeholder="Es. Quiz sulle Serie TV" required><label style="margin-top:10px;display:block"><b>Scegli un'icona per il quiz:</b></label><select id="quiz-icon"><option value="📝">📝 Appunti</option><option value="🔥">🔥 Fuoco</option><option value="⚔️">⚔️ Spada</option><option value="🚀">🚀 Razzo</option><option value="👑">👑 Corona</option><option value="🐉">🐉 Drago</option><option value="👽">👽 Alieno</option><option value="💻">💻 PC</option></select><label style="margin-top:10px;display:block"><b>Password di Modifica/Eliminazione:</b></label><input type="password" id="quiz-pass" placeholder="Imposta una password numerica o testuale" required></div><div id="questions-container"></div><button type="button" id="btn-add-q" class="btn btn-add">➕ Aggiungi Domanda</button><button type="submit" class="btn">💾 Salva Quiz nell'Hub</button></form></div><script>const container=document.getElementById("questions-container");let qCount=0;const urlParams=new URLSearchParams(window.location.search);const editId=urlParams.get("edit")?parseInt(urlParams.get("edit")):null;function addQuestion(text="",a="",b="",c="",d="",correct="A"){qCount++;const div=document.createElement("div");div.className="form-group";div.id=`g-q-${qCount}`;div.innerHTML=`<button type="button" class="btn-del-q" onclick="removeQuestion(${qCount})">🗑️</button><h3>Domanda</h3><input type="text" class="q-text" placeholder="Testo della domanda" value="${text}" required><input type="text" class="q-a" placeholder="Opzione A" value="${a}" required><input type="text" class="q-b" placeholder="Opzione B" value="${b}" required><input type="text" class="q-c" placeholder="Opzione C" value="${c}" required><input type="text" class="q-d" placeholder="Opzione D" value="${d}" required><label>Risposta esatta:</label><select class="q-correct"><option value="A" ${correct==='A'?'selected':''}>Opzione A</option><option value="B" ${correct==='B'?'selected':''}>Opzione B</option><option value="C" ${correct==='C'?'selected':''}>Opzione C</option><option value="D" ${correct==='D'?'selected':''}>Opzione D</option></select>`;container.appendChild(div)}function removeQuestion(id){const el=document.getElementById(`g-q-${id}`);if(el)el.remove()}window.addEventListener("DOMContentLoaded",()=>{const currentQuizzes=JSON.parse(localStorage.getItem("customQuizzes")||"[]");if(editId!==null){const target=currentQuizzes.find(q=>q.id===editId);if(target){document.getElementById("page-title").innerText="⚙️ Modifica il tuo Quiz";document.getElementById("quiz-title").value=target.title;document.getElementById("quiz-icon").value=target.icon||"📝";document.getElementById("quiz-pass").value=target.password||"";target.questions.forEach(q=>{addQuestion(q.text,q.options[0],q.options[1],q.options[2],q.options[3],q.correct)})}}if(qCount===0)addQuestion()});document.getElementById("btn-add-q").addEventListener("click",()=>addQuestion());document.getElementById("quiz-form").addEventListener("submit",function(e){e.preventDefault();const title=document.getElementById("quiz-title").value;const icon=document.getElementById("quiz-icon").value;const password=document.getElementById("quiz-pass").value;const questions=[];const blocks=container.querySelectorAll(".form-group");blocks.forEach(block=>{questions.push({text:block.querySelector(".q-text").value,options:[block.querySelector(".q-a").value,block.querySelector(".q-b").value,block.querySelector(".q-c").value,block.querySelector(".q-d").value],correct:block.querySelector(".q-correct").value})});let currentQuizzes=JSON.parse(localStorage.getItem("customQuizzes")||"[]");if(editId!==null){currentQuizzes=currentQuizzes.filter(q=>q.id!==editId)}const newQuiz={id:editId||Date.now(),title:title,icon:icon,password:password,questions:questions};currentQuizzes.push(newQuiz);localStorage.setItem("customQuizzes",JSON.stringify(currentQuizzes));alert("Quiz salvato con successo!");window.location.href="index.html"});</script></body></html>
