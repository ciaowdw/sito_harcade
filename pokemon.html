<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Pokémon - Gaming Hub</title>
    <!-- Collegamento allo stile comune dell'hub -->
    <link rel="stylesheet" href="style.css">
    <style>
        .quiz-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 240, 255, 0.2);
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            text-align: left;
        }
        .question-text {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 15px;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option-btn {
            background: #2a2a40;
            border: 1px solid rgba(0, 240, 255, 0.3);
            color: #fff;
            padding: 12px 15px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
        }
        /* Classi dinamiche per il feedback delle risposte */
        .option-btn.correct {
            background: #2b8a3e !important;
            border-color: #40c057 !important;
            box-shadow: 0 0 12px #2b8a3e;
        }
        .option-btn.wrong {
            background: #c92a2a !important;
            border-color: #fa5252 !important;
            box-shadow: 0 0 12px #c92a2a;
        }
        .option-btn:hover:not(:disabled) {
            background: rgba(0, 240, 255, 0.1);
            border-color: #00f0ff;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }
        .option-btn:disabled {
            cursor: not-allowed;
        }
        .result-box {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #b3b3b3;
            text-decoration: none;
            font-size: 0.95rem;
        }
        .back-link:hover { color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔴 Quiz Pokémon Master 🔴</h2>
        <p id="quiz-progress">Domanda 1 di 15</p>

        <!-- Contenitore Domande attive -->
        <div class="quiz-box" id="quiz-screen">
            <div class="question-text" id="question">Caricamento domanda...</div>
            <div class="options-list" id="options"></div>
        </div>

        <!-- Schermata di Fine Quiz -->
        <div class="result-box" id="result-screen">
            <h3 id="result-title" style="color: #ffaa00; font-size: 1.8rem; margin-bottom: 10px;">Quiz Terminato!</h3>
            <p id="result-score" style="font-size: 1.2rem; color: #fff;"></p>
            <p id="result-reward" style="color: #00f0ff; font-weight: bold; margin-top: 10px;"></p>
            <button class="btn-card game-btn" onclick="location.reload()" style="width: 100%; margin-top: 20px; justify-content: center;">🔄 Riprova il Quiz</button>
        </div>

        <a href="index.html" class="back-link">⬅ Torna al Menu Principale</a>
    </div>

    <script>
        const domande = [
            { q: "Qual è il Pokémon iniziale di tipo Fuoco nella prima generazione?", o: ["Charmander", "Cyndaquil", "Torchic", "Vulpix"], a: 0 },
            { q: "Di che tipo è il Pokémon leggendario Mewtwo?", o: ["Spettro", "Buio", "Psico", "Acciaio"], a: 2 },
            { q: "Quale strumento serve per far evolvere Pikachu in Raichu?", o: ["Pietrafocaia", "Pietratuono", "Pietrasolare", "Pietraidrica"], a: 1 },
            { q: "Quanti sono i Pokémon iniziali che puoi scegliere a Kanto (escluso Pikachu)?", o: ["2", "3", "4", "5"], a: 1 },
            { q: "Qual è l'evoluzione finale di Gastly?", o: ["Haunter", "Gengar", "Dusclops", "Alakazam"], a: 1 },
            { q: "Quale di questi Pokémon è noto come Pokémon 'Sveglia'?", o: ["Jigglypuff", "Meowth", "Loudred", "Chimecho"], a: 0 },
            { q: "Di quale generazione fa parte il Pokémon leggendario Rayquaza?", o: ["Prima", "Seconda", "Terza", "Quarta"], a: 2 },
            { q: "Qual è l'unica debolezza dei Pokémon di tipo Elettro puro?", o: ["Terra", "Roccia", "Acqua", "Erba"], a: 0 },
            { q: "In quale Pokémon si evolve Eevee usando la Pietraidrica?", o: ["Jolteon", "Flareon", "Vaporeon", "Espeon"], a: 2 },
            { q: "Chi è il leader del Team Rocket?", o: ["Lance", "Giovanni", "Ester", "Nardo"], a: 1 },
            { q: "Quale di questi Pokémon NON è un leggendario?", o: ["Articuno", "Arcanine", "Raikou", "Regice"], a: 1 },
            { q: "Quale mossa usa tradizionalmente Splash senza fare danni?", o: ["Magikarp", "Feebas", "Goldeen", "Wailmer"], a: 0 },
            { q: "Qual è il tipo secondario di Charizard?", o: ["Drago", "Volante", "Fuoco", "Terra"], a: 1 },
            { q: "Quale mossa permette a un Pokémon di fuggire istantaneamente dalle lotte selvatiche?", o: ["Teletrasporto", "Boato", "Turbine", "Fintoattacco"], a: 0 },
            { q: "Qual è il nome della regione introdotta nei giochi Pokémon Diamante e Perla?", o: ["Sinnoh", "Hoenn", "Johto", "Unima"], a: 0 }
        ];

        let indexDomanda = 0;
        let risposteCorrette = 0;

        function mostraDomanda() {
            if (indexDomanda < domande.length) {
                document.getElementById('quiz-progress').innerText = `Domanda ${indexDomanda + 1} di ${domande.length}`;
                document.getElementById('question').innerText = domande[indexDomanda].q;
                
                const containerOpzioni = document.getElementById('options');
                containerOpzioni.innerHTML = '';

                domande[indexDomanda].o.forEach((opzione, i) => {
                    const bottone = document.createElement('button');
                    bottone.className = 'option-btn';
                    bottone.innerText = opzione;
                    bottone.onclick = () => controllaRisposta(i, bottone);
                    containerOpzioni.appendChild(bottone);
                });
            } else {
                mostraRisultatoFinale();
            }
        }

        function controllaRisposta(indiceScelto, bottoneCliccato) {
            const indiceCorretto = domande[indexDomanda].a;
            const tuttiIBottoni = document.querySelectorAll('.option-btn');

            // Disabilita tutti i bottoni temporaneamente per impedire doppi click
            tuttiIBottoni.forEach(btn => btn.disabled = true);

            if (indiceScelto === indiceCorretto) {
                bottoneCliccato.classList.add('correct');
                risposteCorrette++;
            } else {
                bottoneCliccato.classList.add('wrong');
                // Evidenzia visivamente qual era quella giusta
                tuttiIBottoni[indiceCorretto].classList.add('correct');
            }

            // Aspetta 1.2 secondi mostrando l'esito grafico prima di cambiare domanda
            setTimeout(() => {
                indexDomanda++;
                mostraDomanda();
            }, 1200);
        }

        function mostraRisultatoFinale() {
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('quiz-progress').style.display = 'none';
            
            const resultScreen = document.getElementById('result-screen');
            const scoreText = document.getElementById('result-score');
            const rewardText = document.getElementById('result-reward');
            
            resultScreen.style.display = 'block';
            scoreText.innerText = `Hai totalizzato ${risposteCorrette} su ${domande.length} risposte esatte!`;

            if (risposteCorrette >= 11) {
                if (localStorage.getItem('obj_pokemon_done') !== 'true') {
                    let totalHubXP = parseInt(localStorage.getItem('hub_total_xp') || '0');
                    localStorage.setItem('hub_total_xp', (totalHubXP + 40).toString());
                    localStorage.setItem('obj_pokemon_done', 'true');
                }
                rewardText.innerText = "🏆 OBIETTIVO RAGGIUNTO! Hai fatto almeno 11 punti: guadagni +40 XP e sblocchi il Medaglione 'Pokedex Master'!";
                rewardText.style.color = "#00f0ff";
            } else {
                rewardText.innerText = `Ti mancano ${11 - risposteCorrette} risposte corrette per raggiungere l'obiettivo (minimo 11/15) e sbloccare il Medaglione!`;
                rewardText.style.color = "#aaa";
            }
        }

        mostraDomanda();
    </script>
</body>
</html>
