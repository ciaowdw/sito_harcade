<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Clicker - Upgrade Shop</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="clicker-style.css">
    <style>
        /* Animazione visiva per il Level Up */
        .level-up-animation {
            position: fixed;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            font-size: 3rem;
            font-weight: bold;
            color: #ffaa00;
            text-shadow: 0 0 20px #ffaa00, 0 0 40px #ff007f;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .level-up-animation.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.2);
        }
    </style>
</head>
<body>
    <!-- Scritta animata di sblocco livello -->
    <div id="level-up-text" class="level-up-animation">LEVEL UP! 🚀</div>

    <div class="container">
        <h2>🖱️ Cyber Clicker 🖱️</h2>
        
        <div class="clicker-container">
            <div class="stat-box">Livello Clicker: <span id="clicker-lvl" style="color: #ff007f;">1</span></div>
            
            <div class="coin-button" id="coin">🪙</div>
            <div class="coin-name" id="coin-title">Moneta di Rame Ruggine</div>
            
            <div class="stat-box">Monete Attuali: <span id="coin-count" style="color: #fff;">0</span></div>
            <div style="font-size: 0.85rem; color: #aaa; margin-top: 5px;">
                Progresso Livello: <span id="lvl-progress-text">0</span> / <span id="next-lvl-cost">125</span>
            </div>
            
            <div class="progress-container">
                <div class="progress-bar" id="clicker-progress"></div>
            </div>
        </div>

        <!-- Negozio di Potenziamenti -->
        <div class="shop-section">
            <div class="shop-title">🛒 NEGOZIO UPGRADE</div>
            
            <div class="shop-item">
                <div class="item-info">
                    <h4>Super Clic</h4>
                    <p>Ogni clic vale di più (+1 moneta/click)</p>
                </div>
                <button class="buy-btn" id="buy-clicker" onclick="comperaSfida('click')">Costo: 30</button>
            </div>

            <div class="shop-item">
                <div class="item-info">
                    <h4>Auto-Clicker 🤖</h4>
                    <p>Genera monete automaticamente ogni second</p>
                </div>
                <button class="buy-btn" id="buy-auto" onclick="comperaSfida('auto')">Costo: 80</button>
            </div>
        </div>

        <a href="index.html" class="back-link">⬅ Torna al Menu Principale</a>
    </div>

    <script>
        const coinElement = document.getElementById('coin');
        const coinTitleElement = document.getElementById('coin-title');
        const coinCountElement = document.getElementById('coin-count');
        const nextLvlCostElement = document.getElementById('next-lvl-cost');
        const clickerLvlElement = document.getElementById('clicker-lvl');
        const progressBar = document.getElementById('clicker-progress');
        const lvlProgressText = document.getElementById('lvl-progress-text');
        const levelUpText = document.getElementById('level-up-text');
        
        const buyClickBtn = document.getElementById('buy-clicker');
        const buyAutoBtn = document.getElementById('buy-auto');

        let moneteAttuali = 0;
        let progressToNextLevel = 0;
        let clickerLevel = 1;
        
        let monetePerClick = 1;
        let moneteAlSecondo = 0;
        
        let costoSuperClick = 30;
        let costoAutoClicker = 80;

        // Configurazione delle evoluzioni visive
        const levelUpgrades = {
            1: { emoji: "🪙", name: "Moneta di Rame Ruggine", bg: "linear-gradient(135deg, #1e1e2f, #111119)", coinBg: "radial-gradient(circle, #b87333, #8b5a2b)" },
            2: { emoji: "⚙️", name: "Ingranaggio di Ferro Minerale", bg: "linear-gradient(135deg, #2a2d34, #111317)", coinBg: "radial-gradient(circle, #aaaaaa, #555555)" },
            3: { emoji: "🟡", name: "Lingotto d'Oro Puro", bg: "linear-gradient(135deg, #3a321d, #14110b)", coinBg: "radial-gradient(circle, #ffcc00, #cc9900)" },
            4: { emoji: "💎", name: "Cristallo di Diamante Fluorescente", bg: "linear-gradient(135deg, #1d333a, #0b1316)", coinBg: "radial-gradient(circle, #00f0ff, #0099aa)" },
            5: { emoji: "🔮", name: "Nucleo Energetico Plasma", bg: "linear-gradient(135deg, #321d3a, #130b16)", coinBg: "radial-gradient(circle, #ff007f, #990055)" },
            6: { emoji: "🌌", name: "Chip Quantistico della Matrice", bg: "linear-gradient(135deg, #120c1f, #05020a)", coinBg: "radial-gradient(circle, #7000ff, #3b0099)" },
            7: { emoji: "🪐", name: "Frammento di Antimateria", bg: "linear-gradient(135deg, #0d1b2a, #010811)", coinBg: "radial-gradient(circle, #415a77, #1b263b)" },
            8: { emoji: "☀️", name: "Essenza Stella Madre", bg: "linear-gradient(135deg, #4a1212, #140303)", coinBg: "radial-gradient(circle, #e63946, #9b2226)" },
            9: { emoji: "👑", name: "Reliquia del Re dei Hacker", bg: "linear-gradient(135deg, #133a1b, #031407)", coinBg: "radial-gradient(circle, #52b788, #1b4332)" },
            10: { emoji: "🌀", name: "Singolarità dell'Infinito", bg: "linear-gradient(135deg, #000000, #0a0a0a)", coinBg: "radial-gradient(circle, #ffffff, #333333)" }
        };

        // Calcola il traguardo richiesto che raddoppia ogni volta
        function getRequiredXP() {
            return 125 * Math.pow(2, clickerLevel - 1);
        }

        coinElement.addEventListener('click', () => {
            moneteAttuali += monetePerClick;
            progressToNextLevel += monetePerClick;
            
            controllaEvoluzione();
            aggiornaSchermo();
        });

        function controllaEvoluzione() {
            let target = getRequiredXP();
            if (progressToNextLevel >= target) {
                progressToNextLevel -= target;
                clickerLevel++;
                
                // Salva l'XP dell'Hub principale
                let currentHubXP = parseInt(localStorage.getItem('hub_total_xp') || '0');
                localStorage.setItem('hub_total_xp', (currentHubXP + 30).toString());
                
                triggerLevelUpAnimation();
            }
        }

        function triggerLevelUpAnimation() {
            levelUpText.classList.add('show');
            setTimeout(() => {
                levelUpText.classList.remove('show');
            }, 1500);
        }

        function comperaSfida(tipo) {
            if (tipo === 'click' && moneteAttuali >= costoSuperClick) {
                moneteAttuali -= costoSuperClick;
                monetePerClick += 1;
                costoSuperClick = Math.floor(costoSuperClick * 1.6);
            } else if (tipo === 'auto' && moneteAttuali >= costoAutoClicker) {
                moneteAttuali -= costoAutoClicker;
                moneteAlSecondo += 1;
                costoAutoClicker = Math.floor(costoAutoClicker * 1.7);
            }
            aggiornaSchermo();
        }

        // Loop Auto-Clicker
        setInterval(() => {
            if (moneteAlSecondo > 0) {
                moneteAttuali += moneteAlSecondo;
                progressToNextLevel += moneteAlSecondo;
                controllaEvoluzione();
                aggiornaSchermo();
            }
        }, 1000);

        function aggiornaSchermo() {
            let target = getRequiredXP();
            let percent = (progressToNextLevel / target) * 100;
            progressBar.style.width = Math.min(percent, 100) + '%';
            
            let currentStyle = levelUpgrades[clickerLevel] || levelUpgrades[10];
            
            clickerLvlElement.innerText = clickerLevel;
            coinCountElement.innerText = moneteAttuali.toLocaleString();
            lvlProgressText.innerText = progressToNextLevel.toLocaleString();
            nextLvlCostElement.innerText = target.toLocaleString();
            
            coinElement.innerText = currentStyle.emoji;
            coinTitleElement.innerText = currentStyle.name;
            
            document.body.style.background = currentStyle.bg;
            coinElement.style.background = currentStyle.coinBg;

            buyClickBtn.innerText = `Costo: ${costoSuperClick}`;
            buyClickBtn.disabled = moneteAttuali < costoSuperClick;

            buyAutoBtn.innerText = `Costo: ${costoAutoClicker}`;
            buyAutoBtn.disabled = moneteAttuali < costoAutoClicker;
        }

        aggiornaSchermo();
    </script>
</body>
</html>
