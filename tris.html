<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tris VS Bot - Difficoltà</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .difficulty-selector {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
        }
        .diff-btn {
            background: #2a2a40;
            border: 2px solid #333;
            color: #aaa;
            padding: 8px 12px;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .diff-btn.active {
            color: #fff;
            border-color: #00f0ff;
            background: rgba(0, 240, 255, 0.15);
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 20px 0;
        }
        .cell {
            background: #2a2a40;
            border: 2px solid rgba(0, 240, 255, 0.3);
            border-radius: 12px;
            height: 90px;
            font-size: 2.8rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .cell:hover {
            background: rgba(0, 240, 255, 0.1);
            border-color: #00f0ff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }
        .cell.x { color: #ff007f; text-shadow: 0 0 10px #ff007f; }
        .cell.o { color: #00f0ff; text-shadow: 0 0 10px #00f0ff; }
        
        .status-msg {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: #ffaa00;
            min-height: 24px;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #b3b3b3;
            text-decoration: none;
            font-size: 0.95rem;
        }
        .back-link:hover { color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <h2>❌ Tris VS Bot 🤖</h2>
        
        <!-- Scelta Difficoltà -->
        <div class="difficulty-selector">
            <button class="diff-btn" data-diff="easy">Facile</button>
            <button class="diff-btn active" data-diff="medium">Medio</button>
            <button class="diff-btn" data-diff="hard">Difficile</button>
        </div>

        <div class="status-msg" id="status">Tocca a te! (Sei la X)</div>
        
        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <button class="btn-card game-btn" id="restart-btn" style="width:100%; display:none; margin-top:15px; justify-content: center;">🔄 Gioca Ancora</button>
        <br>
        <a href="index.html" class="back-link">⬅ Torna al Menu Principale</a>
    </div>

    <script>
        const cells = document.querySelectorAll('.cell');
        const statusElement = document.getElementById('status');
        const restartBtn = document.getElementById('restart-btn');
        const diffButtons = document.querySelectorAll('.diff-btn');

        let board = ['', '', '', '', '', '', '', '', ''];
        let isGameActive = true;
        let currentPlayer = 'X'; 
        let currentDifficulty = 'medium';

        // Mappa protetta da bug: convertiamo stringhe in numeri per evitare cancellazioni nel testo
        const winningConditions = [
            "0,1,2".split(",").map(Number),
            "3,4,5".split(",").map(Number),
            "6,7,8".split(",").map(Number),
            "0,3,6".split(",").map(Number),
            "1,4,7".split(",").map(Number),
            "2,5,8".split(",").map(Number),
            "0,4,8".split(",").map(Number),
            "2,4,6".split(",").map(Number)
        ];

        cells.forEach(cell => cell.addEventListener('click', handleCellClick));
        restartBtn.addEventListener('click', restartGame);

        diffButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                if (!isGameActive && board.some(c => c !== '')) return;
                diffButtons.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentDifficulty = e.target.getAttribute('data-diff');
                restartGame();
            });
        });

        function handleCellClick(e) {
            const index = parseInt(e.target.getAttribute('data-index'));

            if (board[index] !== '' || !isGameActive || currentPlayer !== 'X') return;

            makeMove(index, 'X');
            
            if (checkWin('X')) {
                endGame('Hai vinto! 🎉 +50 XP');
                salvaVittoria();
                return;
            }
            if (checkDraw()) {
                endGame('Pareggio! 🤝');
                return;
            }

            currentPlayer = 'O';
            statusElement.innerText = 'Il bot sta pensando...';
            setTimeout(botMove, 400);
        }

        function makeMove(index, player) {
            board[index] = player;
            cells[index].innerText = player;
            cells[index].classList.add(player.toLowerCase());
        }

        function botMove() {
            if (!isGameActive) return;

            let targetIndex = -1;

            if (currentDifficulty === 'easy') {
                targetIndex = getRandomMove();
            } else if (currentDifficulty === 'medium') {
                if (Math.random() < 0.5) {
                    targetIndex = getSmartMove();
                } else {
                    targetIndex = getRandomMove();
                }
            } else if (currentDifficulty === 'hard') {
                targetIndex = getSmartMove();
            }

            if (targetIndex !== -1) {
                makeMove(targetIndex, 'O');

                if (checkWin('O')) {
                    endGame('Il Bot ha vinto! 🤖');
                    return;
                }
                if (checkDraw()) {
                    endGame('Pareggio! 🤝');
                    return;
                }
            }

            currentPlayer = 'X';
            statusElement.innerText = 'Tocca a te! (Sei la X)';
        }

        function getRandomMove() {
            let emptyCells = [];
            board.forEach((val, idx) => { if (val === '') emptyCells.push(idx); });
            if (emptyCells.length === 0) return -1;
            return emptyCells[Math.floor(Math.random() * emptyCells.length)];
        }

        function getSmartMove() {
            let move = findWinningMove('O');
            if (move === -1) move = findWinningMove('X');
            if (move === -1 && board[4] === '') move = 4;
            if (move === -1) {
                const corners = "0,2,6,8".split(",").map(Number);
                let freeCorners = corners.filter(i => board[i] === '');
                if (freeCorners.length > 0) {
                    move = freeCorners[Math.floor(Math.random() * freeCorners.length)];
                } else {
                    move = getRandomMove();
                }
            }
            return move;
        }

        function findWinningMove(player) {
            for (let condition of winningConditions) {
                let count = 0;
                let emptyIdx = -1;
                for (let index of condition) {
                    if (board[index] === player) count++;
                    else if (board[index] === '') emptyIdx = index;
                }
                if (count === 2 && emptyIdx !== -1) {
                    return emptyIdx;
                }
            }
            return -1;
        }

        function checkWin(player) {
            return winningConditions.some(condition => {
                return condition.every(index => board[index] === player);
            });
        }

        function checkDraw() {
            return board.every(cell => cell !== '');
        }

        function endGame(message) {
            statusElement.innerText = message;
            isGameActive = false;
            restartBtn.style.display = 'flex';
        }

        function salvaVittoria() {
            let currentXP = parseInt(localStorage.getItem('hub_total_xp') || '0');
            localStorage.setItem('hub_total_xp', (currentXP + 50).toString());
            localStorage.setItem('badge_tris_won', 'true');
        }

        function restartGame() {
            board = ['', '', '', '', '', '', '', '', ''];
            isGameActive = true;
            currentPlayer = 'X';
            statusElement.innerText = 'Tocca a te! (Sei la X)';
            restartBtn.style.display = 'none';
            cells.forEach(cell => {
                cell.innerText = '';
                cell.classList.remove('x', 'o');
            });
        }
    </script>
</body>
</html>
