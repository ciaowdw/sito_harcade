<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test dei Riflessi a Schermo Intero - Pro Player</title>
    <!-- Collegamento allo stile comune dell'hub -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* Rende l'intera pagina l'area interattiva di clic */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111119;
            cursor: pointer;
            transition: background 0.1s ease;
        }
        
        /* Stati dinamici dell'intero schermo */
        body.waiting {
            background: #c92a2a !important;
        }
        
        body.now {
            background: #2b8a3e !important;
        }

        /* Il contenitore centrale fluttua sopra lo sfondo cliccabile */
        .container {
            position: relative;
            z-index: 10;
            pointer-events: none; /* Evita che i clic sul testo vengano bloccati */
            background: rgba(0, 0, 0, 0.7);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }

        /* Forza i link e i pulsanti a riattivare i clic per poter tornare indietro */
        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #b3b3b3;
            text-decoration: none;
            font-size: 0.95rem;
            pointer-events: auto; 
            transition: color 0.3s;
        }
        .back-link:hover { color: #fff; }

        .box-text {
            font-size: 1.8rem;
            font-weight: bold;
            color: #fff;
            margin: 20px 0;
        }

        .box-subtext {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .result-text {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffaa00;
            min-height: 45px;
            margin-top: 15px;
        }

        .record-box {
            font-size: 1.1rem;
            color: #00f0ff;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(0, 240, 255, 0.3);
            margin-bottom: 10px;
        }
    </style>
</head>
<body id="game-body">

    <div class="container">
        <h2>⚡ Test dei Riflessi ⚡</h2>
        <p>Clicca in UN QUALUNQUE PUNTO dello schermo per interagire.</p>

        <div class="record-box">👑 Record: <span id="high-score">---</span> ms</div>

        <div class="box-text" id="main-text">Clicca Ovunque per Iniziare</div>
        <div class="box-subtext" id="sub-text">Tocca lo schermo quando sei pronto</div>

        <div class="result-text" id="result-message"></div>

        <a href="index.html" class="back-link">⬅ Torna al Menu Principale</a>
    </div>

    <script>
        const gameBody = document.getElementById('game-body');
        const mainText = document.getElementById('main-text');
        const subText = document.getElementById('sub-text');
        const resultMessage = document.getElementById('result-message');
        const highScoreEl = document.getElementById('high-score');

        let gameState = 'idle'; // idle, waiting, now, finished
        let startTime = 0;
        let timeoutId = null;

        function aggiornaRecordVisivo() {
            const salvataggioRecord = localStorage.getItem('reaction_best_score');
            if (salvataggioRecord) {
                highScoreEl.innerText = salvataggioRecord;
            }
        }

        // Ascolta il clic su qualunque punto della pagina corporea
        gameBody.addEventListener('mousedown', (e) => {
            // Se clicchi sul link per tornare indietro, non attivare il gioco
            if (e.target.closest('.back-link')) return;

            if (gameState === 'idle' || gameState === 'finished') {
                startTest();
            } else if (gameState === 'waiting') {
                triggerFalseStart();
            } else if (gameState === 'now') {
                calculateReactionTime();
            }
        });

        function startTest() {
            gameState = 'waiting';
            resultMessage.innerText = '';
            gameBody.className = 'waiting';
            mainText.innerText = 'ATTENDI IL VERDE...';
            subText.innerText = 'Pronto a cliccare ovunque!';

            const randomDelay = Math.floor(Math.random() * 3000) + 2000;
            
            timeoutId = setTimeout(() => {
                gameState = 'now';
                gameBody.className = 'now';
                mainText.innerText = 'CLICCA ORA! ⚡';
                subText.innerText = 'TOCCA LO SCHERMO!';
                startTime = window.performance.now();
            }, randomDelay);
        }

        function triggerFalseStart() {
            clearTimeout(timeoutId);
            gameState = 'finished';
            gameBody.className = '';
            mainText.innerText = 'ANTICIPO! ❌';
            subText.innerText = 'Hai cliccato prima del verde.';
            resultMessage.innerText = 'Clicca di nuovo in un punto qualsiasi per riprovare.';
            resultMessage.style.color = '#fa5252';
        }

        function calculateReactionTime() {
            const endTime = window.performance.now();
            const reactionTime = Math.round(endTime - startTime);
            
            gameState = 'finished';
            gameBody.className = '';
            mainText.innerText = `${reactionTime} ms`;
            subText.innerText = 'Clicca ovunque per rifare';

            const recordPrecedente = localStorage.getItem('reaction_best_score');
            if (!recordPrecedente || reactionTime < parseInt(recordPrecedente)) {
                localStorage.setItem('reaction_best_score', reactionTime.toString());
                aggiornaRecordVisivo();
            }

            if (reactionTime < 200) {
                resultMessage.innerText = `🏆 TRAGUARDO SUPERATO! Tempo: ${reactionTime}ms. Guadagni +60 XP e sblocchi il Medaglione 'Riflessi Luce'!`;
                resultMessage.style.color = "#00f0ff";

                if (localStorage.getItem('obj_reaction_done') !== 'true') {
                    let totalHubXP = parseInt(localStorage.getItem('hub_total_xp') || '0');
                    localStorage.setItem('hub_total_xp', (totalHubXP + 60).toString());
                    localStorage.setItem('obj_reaction_done', 'true');
                }
            } else {
                resultMessage.innerText = `Fai meno di 200ms per l'obiettivo. Ti mancavano ${reactionTime - 199}ms!`;
                resultMessage.style.color = "#aaa";
            }
        }

        aggiornaRecordVisivo();
    </script>
</body>
</html>
